<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Share be</title>
<style>
:root{--bg:#FBF5E9;--card:#FFFDF7;--ink:#2B2118;--mute:#7A6A58;--ac:#E2703A;--ac2:#C2410C;--line:#EADFC8;--sh:0 8px 24px rgba(90,60,20,.14);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1812;--card:#2A231B;--ink:#F6EBD6;--mute:#B7A78F;--line:#3A3126;--sh:0 8px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1812;--card:#2A231B;--ink:#F6EBD6;--mute:#B7A78F;--line:#3A3126;--sh:0 8px 24px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
button,input,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
header{position:fixed;top:env(safe-area-inset-top,0px);inset-inline:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line);z-index:20}
.pill{height:44px;border-radius:22px;border:1.5px solid var(--ink);background:var(--card);display:flex;align-items:center;gap:8px;padding:0 16px;cursor:pointer;white-space:nowrap}
.srch{flex:1;cursor:text}.srch input{border:0;background:none;outline:0;flex:1;min-width:0}
.circ{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);transition:.2s}.circ:hover{transform:scale(1.1) rotate(90deg)}
#logo{cursor:pointer;width:150px;height:46px}
nav{position:fixed;top:calc(78px + env(safe-area-inset-top,0px));right:12px;display:flex;flex-direction:column;gap:14px;z-index:15}
.nv{display:flex;align-items:center;width:56px;height:56px;border-radius:28px;border:1.5px solid var(--ink);background:var(--card);overflow:hidden;cursor:pointer;transition:width .3s,box-shadow .3s,transform .3s;color:var(--ink);text-decoration:none;white-space:nowrap}
.nv .ic{width:53px;height:53px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex:none;margin:0;transition:.3s}
.nv span{padding:0 14px 0 18px;font-weight:600;opacity:0;transition:.3s}
.nv:hover{width:190px;box-shadow:var(--sh)}.nv:hover span{opacity:1}
.nv.on{border-color:var(--ac2);transform:scale(1.08)}.nv.on .ic{background:var(--ac);color:#fff;box-shadow:0 0 0 4px rgba(226,112,58,.25)}
main{padding:84px 90px 40px 16px;max-width:1300px;margin:0 auto}
h2{margin:18px 4px 12px;font-size:20px;display:flex;gap:8px;align-items:center}
.mq{overflow:hidden;direction:ltr;border-radius:18px;background:var(--card);padding:12px 0;border:1px solid var(--line)}
.tr{display:flex;gap:12px;width:max-content;animation:mq 70s linear infinite}.mq:hover .tr{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.tr .card{width:150px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{position:relative;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#000;cursor:pointer;box-shadow:var(--sh);transition:transform .25s;direction:rtl}
.card:hover{transform:translateY(-4px) scale(1.02)}
.card .m,.card .m>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{position:absolute;inset-inline:0;bottom:0;padding:34px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.who{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.d{margin:5px 0 0;font-size:12px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.acts{position:absolute;top:8px;inset-inline:8px;display:flex;gap:6px;opacity:0;transition:.2s}.card:hover .acts{opacity:1}
.sb{height:34px;min-width:34px;padding:0 10px;border-radius:17px;border:0;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;gap:5px;cursor:pointer;font-size:13px}.sb.lk.on{background:#e11d48}.sb:hover{background:var(--ac)}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;object-fit:cover;flex:none;overflow:hidden}
.mark{position:absolute;top:8px;inset-inline-start:8px}
.empty{padding:50px;text-align:center;color:var(--mute)}
.bg{position:fixed;inset:0;background:rgba(20,14,8,.72);z-index:50;display:flex;align-items:center;justify-content:center}
.mod{background:var(--card);border-radius:22px;padding:22px;width:min(520px,94vw);max-height:92vh;overflow:auto;box-shadow:var(--sh)}
.mod h3{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.f{display:block;width:100%;margin:6px 0;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);outline:0}.f:focus{border-color:var(--ac)}
.drop{border:2px dashed var(--ac);border-radius:18px;padding:22px;text-align:center;cursor:pointer;color:var(--mute);margin:8px 0}.drop.hv{background:rgba(226,112,58,.12)}
.prev{max-height:220px;max-width:100%;border-radius:12px;margin:6px auto;display:block}
.btn{border:0;border-radius:22px;height:44px;padding:0 22px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}.btn:hover{background:var(--ac2)}.btn.o{background:none;color:var(--ink);border:1.5px solid var(--ink)}.btn.on{background:var(--mute)}
.vw{position:fixed;inset:0;background:rgba(15,10,5,.9);z-index:60;display:flex;align-items:center;justify-content:center;gap:16px}
.ph{position:relative;height:min(92vh,880px);aspect-ratio:9/16;max-width:94vw;border-radius:34px;overflow:hidden;background:#15607f;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ph .m,.ph .m>*{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0d0a07}
.ph .top{position:absolute;top:14px;inset-inline:14px;display:flex;justify-content:space-between;z-index:3}
.ph .bot{position:absolute;bottom:0;inset-inline:0;padding:60px 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;z-index:2}
.side{position:absolute;bottom:90px;inset-inline-start:12px;display:flex;flex-direction:column;gap:12px;z-index:3;align-items:center}
.side .circ{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);width:50px;height:50px}.side .circ.on{background:#e11d48}
.cnt{color:#fff;font-size:13px;font-weight:700;text-align:center;margin-top:-6px}
.arr{width:34px;height:min(46vh,380px);border-radius:17px;border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;display:grid;place-items:center}.arr:hover{background:var(--ac)}
.xx{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:14px;z-index:70}
.fh{position:absolute;pointer-events:none;color:#e11d48;animation:fl 1.1s ease-out forwards;z-index:9}
@keyframes fl{0%{transform:translateY(0) scale(.5);opacity:1}100%{transform:translateY(-200px) scale(1.7) rotate(var(--r));opacity:0}}
.outro{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:linear-gradient(135deg,#E2703A,#d63384,#6f42c1,#0d9488,#E2703A);background-size:400% 400%;animation:cc 3s linear infinite}
@keyframes cc{0%{background-position:0 0}100%{background-position:100% 100%}}
.prof{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:24px;padding:22px;border:1px solid var(--line)}
.stats{display:flex;gap:22px;margin:10px 0;flex-wrap:wrap}.stats b{display:block;font-size:20px}.stats div{cursor:pointer;text-align:center}
.ul a{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;color:var(--ink);text-decoration:none;cursor:pointer}.ul a:hover{background:var(--line)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:22px;z-index:99;opacity:0;transition:.3s;pointer-events:none}#toast.s{opacity:1}
@media(max-width:700px){main{padding:80px 74px 30px 10px}.nv:hover{width:56px}#logo{width:100px}.arr{display:none}.pill.gb span{display:none}}
/* ===== redesign v2: borderless, glass, aurora ===== */
:root{--bg:#F6EEDF;--card:#FFFBF2;--glass:rgba(255,251,242,.62);--ink:#241A10;--mute:#85735F;--line:rgba(120,90,50,.1);--ac:#FF7A3D;--ac2:#E5484D;--g:linear-gradient(135deg,#FF9A3C,#F0406E 55%,#8B5CF6);--sh:0 14px 40px -12px rgba(120,70,20,.28)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14100C;--card:#211A13;--glass:rgba(40,31,22,.6);--ink:#FBF1E0;--mute:#B9A78D;--line:rgba(255,235,200,.08);--sh:0 14px 40px -12px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#14100C;--card:#211A13;--glass:rgba(40,31,22,.6);--ink:#FBF1E0;--mute:#B9A78D;--line:rgba(255,235,200,.08);--sh:0 14px 40px -12px rgba(0,0,0,.7)}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(38% 38% at 18% 18%,rgba(255,140,66,.4),transparent),radial-gradient(34% 40% at 82% 28%,rgba(240,64,110,.28),transparent),radial-gradient(40% 40% at 58% 92%,rgba(139,92,246,.26),transparent);filter:blur(50px);animation:au 20s ease-in-out infinite alternate}
@keyframes au{to{transform:translate(4%,-3%) scale(1.15) rotate(6deg)}}
header{background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:0;box-shadow:0 8px 30px -14px rgba(90,50,10,.35)}
.pill{border:0;background:var(--glass);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 0 transparent,0 6px 18px -8px rgba(90,50,10,.3);transition:.25s;font-weight:600}
.pill:hover{transform:translateY(-1px);box-shadow:0 10px 24px -8px rgba(240,64,110,.4)}
.srch:focus-within{box-shadow:0 0 0 3px rgba(255,122,61,.35),0 10px 26px -8px rgba(240,64,110,.35)}
.circ{background:var(--g);box-shadow:0 10px 26px -6px rgba(240,64,110,.6)}
.circ:hover{transform:scale(1.12) rotate(90deg);box-shadow:0 14px 34px -4px rgba(240,64,110,.8)}
#logo{filter:drop-shadow(0 6px 14px rgba(240,64,110,.45));transition:.3s}#logo:hover{transform:scale(1.06) rotate(-2deg)}
nav{gap:12px;padding:10px 8px;border-radius:40px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--sh);top:calc(82px + env(safe-area-inset-top,0px))}
.nv{border:0;background:transparent;height:52px;width:52px;border-radius:26px;transition:width .35s cubic-bezier(.2,.9,.3,1.2),background .3s,transform .3s}
.nv .ic{width:52px;height:52px;background:transparent;color:var(--mute)}
.nv:hover{width:190px;background:var(--line);box-shadow:none}.nv:hover .ic{color:var(--ink);transform:scale(1.15)}
.nv span{font-size:15px}
.nv.on{transform:scale(1.1);box-shadow:none}.nv.on .ic{background:var(--g);color:#fff;box-shadow:0 10px 26px -6px rgba(240,64,110,.7),0 0 0 6px rgba(255,122,61,.14);animation:pu 2.6s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 10px 30px -4px rgba(240,64,110,.9),0 0 0 11px rgba(255,122,61,.05)}}
h2{font-size:22px;font-weight:800;margin:26px 4px 14px;letter-spacing:-.3px}
h2 svg{color:var(--ac2);filter:drop-shadow(0 4px 8px rgba(240,64,110,.4))}
.mq{border:0;background:transparent;padding:14px 0;border-radius:0;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tr{gap:16px}.tr .card{width:158px}
.card{border-radius:26px;box-shadow:0 14px 30px -14px rgba(60,30,10,.55);transition:transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .35s}
.card:hover{transform:translateY(-8px) scale(1.035) rotate(-.6deg);box-shadow:0 26px 50px -14px rgba(240,64,110,.55);z-index:3}
.card .m>*{transition:transform .6s}.card:hover .m>*{transform:scale(1.08)}
.ov{padding:56px 14px 14px;background:linear-gradient(transparent,rgba(10,6,2,.85))}
.who{font-size:13.5px}.d{opacity:.82}
.acts{opacity:0;transform:translateY(-6px);transition:.25s}.card:hover .acts{opacity:1;transform:none}
.sb{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);height:36px;min-width:36px;border-radius:18px}
.sb:hover{background:var(--g)}.sb.lk.on{background:linear-gradient(135deg,#FF5C7A,#E11D48)}
.mark{background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;top:10px;inset-inline-start:10px}
.av{box-shadow:0 0 0 2px rgba(255,255,255,.65)}
.grid{gap:20px}
.btn{background:var(--g);box-shadow:0 10px 24px -8px rgba(240,64,110,.6);transition:.25s}.btn:hover{background:var(--g);transform:translateY(-2px);box-shadow:0 14px 30px -8px rgba(240,64,110,.8)}
.btn.o{border:0;background:var(--glass);color:var(--ink);box-shadow:0 6px 18px -8px rgba(90,50,10,.4)}.btn.o:hover{background:var(--line)}
.btn.on{background:var(--line);color:var(--ink);box-shadow:none}
.bg{backdrop-filter:blur(10px);background:rgba(15,8,4,.55)}
.mod{border-radius:30px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.f{border:0;background:var(--line);border-radius:16px;transition:.2s}.f:focus{box-shadow:0 0 0 3px rgba(255,122,61,.4);background:var(--card)}
.drop{border:0;background:var(--line);border-radius:22px;transition:.25s}.drop:hover,.drop.hv{background:rgba(255,122,61,.18);transform:scale(1.01)}
.vw{background:rgba(10,6,3,.82);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.ph{border-radius:38px;background:#0d0a07;box-shadow:0 40px 100px -20px rgba(240,64,110,.45),0 0 0 1px rgba(255,255,255,.06);animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.side .circ{background:rgba(255,255,255,.16);box-shadow:none}.side .circ:hover{background:rgba(255,255,255,.3)}.side .circ.on{background:linear-gradient(135deg,#FF5C7A,#E11D48);box-shadow:0 10px 30px -6px rgba(225,29,72,.8)}
.arr{width:30px;background:rgba(255,255,255,.1);transition:.25s}.arr:hover{background:var(--g);transform:scaleY(1.08)}
.xx{background:rgba(255,255,255,.16);box-shadow:none}
.outro{background:conic-gradient(from 0deg at 50% 50%,#FF9A3C,#F0406E,#8B5CF6,#06B6D4,#FF9A3C);animation:spin 5s linear infinite;filter:saturate(1.2)}@keyframes spin{to{filter:hue-rotate(360deg)}}
.outro canvas{filter:drop-shadow(0 10px 30px rgba(0,0,0,.4));animation:pop .8s both}
/* profile */
.prof{position:relative;overflow:hidden;border:0;border-radius:34px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:var(--sh);flex-direction:column;align-items:center;text-align:center;padding:236px 24px 28px;gap:10px}
.prof::before{content:"";position:absolute;inset:0 0 auto 0;height:150px;background:radial-gradient(70% 120% at 20% 0,#FFC371,transparent 60%),radial-gradient(60% 110% at 85% 20%,#F0406E,transparent 60%),linear-gradient(135deg,#8B5CF6,#FF7A3D);background-size:140% 140%;animation:cc 9s ease-in-out infinite alternate}
.prof::after{content:"";position:absolute;inset:100px 0 auto 0;height:60px;background:linear-gradient(transparent,var(--bg));opacity:.25}

.prof>.av{position:absolute;top:80px;inset-inline:0;margin:0 auto;width:140px!important;height:140px!important;font-size:58px!important;box-shadow:0 0 0 7px var(--bg),0 18px 40px -8px rgba(240,64,110,.55)}
.prof>div{width:100%}

.stats div{background:var(--line);padding:12px 26px;border-radius:22px;transition:.25s;min-width:96px}.stats div:hover{background:var(--g);color:#fff;transform:translateY(-3px)}
.stats b{font-size:26px;font-weight:900}
.prof>div>div:last-child{justify-content:center}
.ul a{border-radius:18px}
#settings-note{display:none}
#toast{background:var(--g);color:#fff;box-shadow:0 14px 34px -8px rgba(240,64,110,.6);font-weight:700}
@media(max-width:700px){nav{padding:6px 4px;gap:6px}.nv,.nv .ic{width:46px;height:46px}.prof>.av{width:110px!important;height:110px!important;font-size:44px!important}}

/* ===== v4: clean white, simple social ===== */
:root,:root[data-theme=light]{--bg:#FFFFFF;--card:#FFFFFF;--glass:#FFFFFF;--ink:#14141A;--mute:#6B6B76;--line:#F1F1F4;--ac:#F2542D;--ac2:#D9431F;--g:#F2542D;--sh:none;color-scheme:light}
:root[data-theme=dark]{--bg:#0F0F11;--card:#18181B;--glass:#18181B;--ink:#F3F3F5;--mute:#9A9AA4;--line:#222226;--ac:#F2542D;--ac2:#D9431F;--g:#F2542D;--sh:none;color-scheme:dark}
body::before{display:none}
header{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 1px 0 var(--line)}
.pill{background:var(--line);box-shadow:none;backdrop-filter:none;font-weight:500}.pill:hover{transform:none;box-shadow:none;filter:brightness(.97)}
.srch:focus-within{box-shadow:0 0 0 2px var(--ac)}
.circ{background:var(--ac);box-shadow:none}.circ:hover{transform:scale(1.05);box-shadow:none}
#tg{background:var(--line);color:var(--ink)}
nav{top:calc(80px + env(safe-area-inset-top,0px))}
.nv{background:var(--line);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.nv:hover{background:var(--line);box-shadow:none}
.nv span{font-size:14px;font-weight:600}
.nv.on .ic,.nv.on:hover .ic{background:var(--ac);color:#fff}
h2{font-size:18px;font-weight:700}h2 svg{color:var(--mute)}
.card{border-radius:14px;box-shadow:none;background:var(--line)}.card:hover{transform:none;box-shadow:none}.card:hover .m>*{transform:scale(1.03)}
.av{box-shadow:none}
.btn{box-shadow:none;background:var(--ac)}.btn:hover{background:var(--ac2);filter:none}
.btn.o,.btn.on{background:var(--line);color:var(--ink);box-shadow:none}.btn.o:hover{background:var(--line);filter:brightness(.95)}
.mod{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:18px;box-shadow:0 20px 60px -10px rgba(0,0,0,.35)}
.f,.drop{background:var(--line)}.f:focus{background:var(--bg);box-shadow:0 0 0 2px var(--ac)}.drop:hover,.drop.hv{background:rgba(242,84,45,.1);transform:none}
.bg{backdrop-filter:none;background:rgba(0,0,0,.5)}
.vw{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.88)}
.ph{border-radius:22px;box-shadow:none}
.side .circ.on,.side.dk .circ.on{background:#E5484D}
.cov{border-radius:14px;background:linear-gradient(135deg,#FFD9C7,#FFEFD2)}
:root[data-theme=dark] .cov{background:linear-gradient(135deg,#3B2A22,#2A2630)}
.pfh .av{box-shadow:0 0 0 5px var(--bg)}
.prof,.prof[style*=block]:not(.ul){background:var(--line);box-shadow:none;backdrop-filter:none;border-radius:16px;overflow:visible;padding:20px;text-align:start}
.prof::before,.prof::after{display:none}
#toast{background:var(--ink);color:var(--bg);box-shadow:none;font-weight:600}
</style>
</head>
<body>
<header>
<div class="pill gb" id="gbtn"></div>
<button class="circ" id="plus" aria-label="הוספה"></button>
<button class="circ" id="tg" aria-label="מצב כהה"></button>

<main id="main"></main>
<div id="toast"></div>
<script>
const P={home:"M3 11l9-8 9 8v10h-6v-6H9v6H3z",film:"M5 4h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2zM10 9l5 3-5 3z",image:"M4 4h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1zM3 17l5-5 4 4 3-3 6 6M8.5 9.5h.01",fire:"M12 2c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z",biz:"M3 8h18v12H3zM9 8V5h6v3M3 13h18",plus:"M12 5v14M5 12h14",heart:"M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z",share:"M18 8a3 3 0 100-6 3 3 0 000 6zM6 15a3 3 0 100-6 3 3 0 000 6zM18 22a3 3 0 100-6 3 3 0 000 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4",search:"M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5",gear:"M12 15a3 3 0 100-6 3 3 0 000 6zM19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 00-1.7-1L14.5 3h-4l-.4 3.1a7 7 0 00-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 000 2l-2 1.5 2 3.4 2.3-1a7 7 0 001.7 1l.4 3.1h4l.4-3.1a7 7 0 001.7-1l2.3 1 2-3.4-2-1.5z",user:"M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0",x:"M6 6l12 12M18 6L6 18",trash:"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13",edit:"M4 20h4L19 9l-4-4L4 16zM13 7l4 4",l:"M15 5l-7 7 7 7",r:"M9 5l7 7-7 7",up:"M12 16V4M7 9l5-5 5 5M4 20h16",play:"M8 5v14l11-7z"};
const I=(n,s=22,f)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ME='u1';
let S={users:{u1:{name:'מנהל האתר',about:'',hue:22},u2:{name:'דוד לוי',about:'אוהב לצלם נופים.',hue:200},u3:{name:'יוסי כהן',about:'יוצר תוכן יומיומי.',hue:140},u4:{name:'אורי שמש',about:'עסקים ושיווק.',hue:300}},fol:{u1:['u2'],u2:['u1','u3'],u3:['u1'],u4:['u1','u2']},likes:{},liked:{},del:[],ed:{}};
try{const o=JSON.parse(localStorage.getItem('sb')||'null');if(o)S={...S,...o}}catch(e){}
const save=()=>{try{localStorage.setItem('sb',JSON.stringify(S))}catch(e){}};
let posts=[],db=null,q='';
/* seed images */
function seed(){const D=['נוף בשקיעה','צבעים של בוקר','רגע שקט ליד המים','סדנה עסקית חדשה','שבת בטבע','עיצוב מינימליסטי','הרים ועננים','קפה ושיחה טובה'];
D.forEach((d,i)=>{const c=document.createElement('canvas');c.width=360;c.height=640;const x=c.getContext('2d'),h=(i*47+20)%360,g=x.createLinearGradient(0,0,360,640);g.addColorStop(0,`hsl(${h},80%,62%)`);g.addColorStop(1,`hsl(${h+60},70%,35%)`);x.fillStyle=g;x.fillRect(0,0,360,640);x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.arc(100+i*20,200,90+i*6,0,7);x.fill();x.beginPath();x.arc(260,430,130,0,7);x.fill();
posts.push({id:'p'+(i+1),uid:'u'+(2+i%3),type:'image',src:c.toDataURL('image/jpeg',.7),desc:d+' – תיאור קצר שמראה איך נראה טקסט ארוך יותר בכרטיס, והוא נחתך בצורה יפה.',biz:i==3||i==7,ts:Date.now()-i*3600e3*5,base:[42,17,63,8,29,51,12,35][i],seed:1})})}
/* IDB */
function idb(){return new Promise(r=>{try{const q=indexedDB.open('sharebe',1);q.onupgradeneeded=()=>q.result.createObjectStore('posts',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function idbAll(){return new Promise(r=>{if(!db)return r([]);try{const g=db.transaction('posts').objectStore('posts').getAll();g.onsuccess=()=>r(g.result);g.onerror=()=>r([])}catch(e){r([])}})}
const idbPut=p=>{try{db&&db.transaction('posts','readwrite').objectStore('posts').put(p)}catch(e){}};
const idbDel=id=>{try{db&&db.transaction('posts','readwrite').objectStore('posts').delete(id)}catch(e){}};
/* helpers */
const U=id=>S.users[id]||{name:'משתמש',hue:0};
const lk=p=>(p.base||0)+(S.likes[p.id]||0);
const av=(id,s=28)=>{const u=U(id);return u.img?`<img class="av" width="${s}" height="${s}" src="${u.img}" alt="">`:`<div class="av" style="width:${s}px;height:${s}px;background:hsl(${u.hue},65%,45%);font-size:${s*.45}px">${esc(u.name[0])}</div>`};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('s'),2000)};
const link=h=>location.href.split('#')[0]+'#'+h;
const copy=async(h)=>{try{await navigator.clipboard.writeText(link(h));toast('הקישור הועתק')}catch(e){toast(link(h))}};
const vis=()=>posts.filter(p=>!S.del.includes(p.id)).map(p=>({...p,desc:S.ed[p.id]??p.desc}));
const fol=id=>S.fol[id]||[],followers=id=>Object.keys(S.users).filter(u=>fol(u).includes(id));
/* logo */
const LOGO_ON=false;function logo(c,w,h,big){if(!LOGO_ON)return;const r=devicePixelRatio||1;c.width=w*r;c.height=h*r;c.style.width=w+'px';c.style.height=h+'px';const x=c.getContext('2d');x.scale(r,r);
const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#FF9A3C');g.addColorStop(.5,'#E2406A');g.addColorStop(1,'#7C3AED');
x.fillStyle=g;x.beginPath();x.roundRect(0,0,w,h,h*.3);x.fill();
const k=h/46;x.strokeStyle='#fff';x.fillStyle='#fff';x.lineWidth=2.4*k;
const pts=[[.14*h,.5*h],[.34*h,.25*h],[.34*h,.75*h]].map(a=>a);x.beginPath();x.moveTo(...pts[1]);x.lineTo(...pts[0]);x.lineTo(...pts[2]);x.stroke();
pts.forEach(p=>{x.beginPath();x.arc(p[0],p[1],5.5*k,0,7);x.fill()});
x.font=`800 ${h*.52}px "Segoe UI",Arial,sans-serif`;x.textBaseline='middle';x.textAlign='left';x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=6*k;x.shadowOffsetY=2*k;x.fillText('Share be',h*.62,h*.53);
x.shadowColor='transparent';x.fillStyle='rgba(255,255,255,.28)';x.beginPath();x.roundRect(0,0,w,h*.45,[h*.3,h*.3,0,0]);x.fill()}
/* shell */
const NAV=[['home','home','דף הבית'],['film','videos','סרטונים'],['image','images','תמונות'],['fire','hot','החמים'],['biz','biz','תוכן עסקי']];
function shell(){$('#gbtn').innerHTML=I('user',20)+'<span>התחברות עם גוגל</span>';$('#gbtn').onclick=()=>toast('ההתחברות תתווסף בהמשך');
$('#plus').innerHTML=I('plus',24);$('#plus').onclick=upload;
P.moon='M21 13A9 9 0 1111 3a7 7 0 0010 10z';P.sun='M12 16a4 4 0 100-8 4 4 0 000 8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4';
const rt=document.documentElement,ap=t=>{rt.dataset.theme=t;try{localStorage.setItem('sbt',t)}catch(e){}$('#tg').innerHTML=I(t=='dark'?'sun':'moon',20)};let t0='light';try{t0=localStorage.getItem('sbt')||'light'}catch(e){}ap(t0);$('#tg').onclick=()=>ap(rt.dataset.theme=='dark'?'light':'dark');
$('#sbox').innerHTML=I('search',20)+'<input id="si" placeholder="חיפוש">';$('#si').oninput=e=>{q=e.target.value.trim();render()};
$('#logo').onclick=()=>location.hash='home'}
function nav(cur){$('#nav').innerHTML=NAV.map(n=>`<a class="nv ${cur==n[1]?'on':''}" href="#${n[1]}"><div class="ic">${I(n[0],24)}</div><span>${n[2]}</span></a>`).join('')+`<a class="nv ${cur.startsWith('profile')?'on':''}" href="#profile-${ME}"><div class="ic">${I('user',24)}</div><span>הפרופיל שלי</span></a><a class="nv ${cur=='settings'?'on':''}" href="#settings"><div class="ic">${I('gear',24)}</div><span>הגדרות</span></a>`}
/* cards */
function card(p,list){const v=p.type=='video';return `<div class="card" data-open="${p.id}" ${v?'data-v':''}><div class="m">${v?`<video src="${p.src}#t=0.1" muted loop playsinline preload="metadata"></video>`:`<img src="${p.src}" alt="">`}</div>
<div class="acts"><button class="sb lk ${S.liked[p.id]?'on':''}" data-like="${p.id}">${I('heart',16,S.liked[p.id])}<b>${lk(p)}</b></button><button class="sb" data-share="${p.id}">${I('share',16)}</button>${(!p.seed||1)?`<button class="sb" data-edit="${p.id}">${I('edit',16)}</button><button class="sb" data-del="${p.id}">${I('trash',16)}</button>`:''}</div>
${v?`<div class="mark" style="color:#fff">${I('play',20,1)}</div>`:''}
<div class="ov"><div class="who">${av(p.uid,24)}<span>${esc(U(p.uid).name)}</span></div>${p.desc?`<p class="d">${esc(p.desc)}</p>`:''}</div></div>`}
const filt=l=>q?l.filter(p=>(p.desc+U(p.uid).name).includes(q)):l;
function grid(l){return l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">${I('image',40)}<p>אין תוכן להצגה</p></div>`}
function render(){const h=(location.hash||'#home').slice(1);nav(h);const m=$('#main');let all=vis().sort((a,b)=>b.ts-a.ts),html='';
if(h=='home'){const top=[...all].sort((a,b)=>lk(b)-lk(a)).slice(0,20),t=top.map(card).join('');
html=`<h2>${I('fire',22)} החמים ביותר</h2><div class="mq"><div class="tr">${t}${t}</div></div><h2>${I('home',22)} הכי חדשים</h2>`+grid(filt(all))}
else if(h=='videos')html=`<h2>${I('film')} סרטונים</h2>`+grid(filt(all.filter(p=>p.type=='video')));
else if(h=='images')html=`<h2>${I('image')} תמונות</h2>`+grid(filt(all.filter(p=>p.type=='image')));
else if(h=='hot')html=`<h2>${I('fire')} החמים</h2>`+grid(filt([...all].sort((a,b)=>lk(b)-lk(a))));
else if(h=='biz')html=`<h2>${I('biz')} תוכן עסקי</h2>`+grid(filt(all.filter(p=>p.biz)));
else if(h.startsWith('profile-'))html=profile(h.slice(8),all);
else if(h=='settings')html=settings(all);
else if(h.startsWith('post-')){location.hash='home';setTimeout(()=>openV(h.slice(5),vis()),50);return}
m.innerHTML=html;window.cur=filt(all)}
function profile(id,all){const u=U(id),mine=all.filter(p=>p.uid==id),f1=followers(id),f2=fol(id);
return `<div class="cov"></div><div class="pfh">${av(id,128)}<div class="pfi"><h1 style="margin:0">${esc(u.name)}</h1>
<div class="stats"><div><b>${mine.length}</b>העלאות</div><div data-ul="f1"><b>${f1.length}</b>עוקבים</div><div data-ul="f2"><b>${f2.length}</b>עוקב אחרי</div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap">${id!=ME?`<button class="btn ${fol(ME).includes(id)?'on':''}" data-fl="${id}">${fol(ME).includes(id)?'עוקב':'לעקוב'}</button>`:`<button class="btn o" onclick="location.hash='settings'">${I('edit',18)} עריכת פרופיל</button>`}<button class="btn o" data-sh="profile-${id}">${I('share',18)} שיתוף</button></div></div></div>
<div id="ulb"></div><h2>אודות</h2><p style="margin:4px 8px;color:var(--mute)">${esc(u.about)||'אין עדיין טקסט אודות.'}</p><h2>העלאות</h2>`+grid(filt(mine));window.ulData={f1,f2}}
function settings(all){const n=all.filter(p=>p.uid==ME).reduce((a,p)=>a+lk(p),0),u=U(ME);
return `<h2>${I('gear')} הגדרות פרופיל</h2><div class="prof" style="display:block;max-width:560px"><div style="display:flex;gap:14px;align-items:center">${av(ME,80)}<label class="btn o">${I('up',18)} החלפת תמונה<input type="file" accept="image/*" id="avf" hidden></label></div>
<input class="f" id="sn" value="${esc(u.name)}" placeholder="שם"><textarea class="f" id="sa" rows="4" placeholder="אודות">${esc(u.about)}</textarea>
<p style="color:var(--mute)">${I('heart',16,1)} סה״כ לייקים על התוכן שלך: <b>${n}</b></p><button class="btn" id="ss">שמירה</button></div>`}
/* viewer */
function openV(id,list){list=list.length?list:vis();let i=Math.max(0,list.findIndex(p=>p.id==id)),vw=document.createElement('div');vw.className='vw';document.body.appendChild(vw);
const show=()=>{const p=list[i];if(!p)return close();const v=p.type=='video';history.replaceState(null,'','#post-'+p.id);
vw.innerHTML=`<button class="circ xx" data-x>${I('x',22)}</button><button class="arr" data-n="1">${I('r',22)}</button><div class="ph"><div class="m">${v?`<video src="${p.src}" controls autoplay playsinline></video>`:`<img src="${p.src}" alt="">`}</div>
<div class="top">${p.uid!=ME?`<button class="btn" style="height:34px;padding:0 14px" data-fl="${p.uid}">${fol(ME).includes(p.uid)?'עוקב':'לעקוב'}</button>`:'<span></span>'}<span style="display:flex;gap:6px"><button class="sb" data-edit="${p.id}">${I('edit',16)}</button><button class="sb" data-del="${p.id}">${I('trash',16)}</button></span></div>
<div class="side"><button class="circ ${S.liked[p.id]?'on':''}" data-like="${p.id}">${I('heart',24,S.liked[p.id])}</button><div class="cnt">${lk(p)}</div><button class="circ" data-share="${p.id}">${I('share',22)}</button></div>
<div class="bot"><div class="who" style="cursor:pointer" data-prof="${p.uid}">${av(p.uid,34)}<span>@${esc(U(p.uid).name)}</span></div>${p.desc?`<p style="margin:8px 0 0;font-size:14px">${esc(p.desc)}</p>`:''}</div></div><button class="arr" data-n="-1">${I('l',22)}</button>`;
const vd=$('video',vw);detect(vw);if(vd)vd.onended=()=>{const o=document.createElement('div');o.className='outro';o.innerHTML='<canvas></canvas>';$('.ph',vw).appendChild(o);logo($('canvas',o),240,74);setTimeout(()=>{o.remove();vd.currentTime=0;vd.play()},3500)}};
const close=()=>{vw.remove();document.removeEventListener('keydown',kd);history.replaceState(null,'','#home');render()};
const go=n=>{i=(i+n+list.length)%list.length;show()};
const kd=e=>{if(e.key=='Escape')close();if(e.key=='ArrowRight')go(-1);if(e.key=='ArrowLeft')go(1)};document.addEventListener('keydown',kd);
vw.onclick=e=>{e.stopPropagation();const t=e.target.closest('button,[data-prof]');if(!t){if(e.target==vw)close();return}
if(t.dataset.x!=null)close();else if(t.dataset.n)go(+t.dataset.n);else if(t.dataset.prof){close();location.hash='profile-'+t.dataset.prof}
else if(t.dataset.like){const id=p0().id,was=S.liked[id];toggleLike(id);if(!was)hearts(t);t.classList.toggle('on',!!S.liked[id]);t.innerHTML=I('heart',24,S.liked[id]);$('.cnt',vw).textContent=lk(p0())}else if(t.dataset.share)copy('post-'+p0().id);else if(t.dataset.fl){toggleFol(t.dataset.fl);t.textContent=fol(ME).includes(t.dataset.fl)?'עוקב':'לעקוב'}
else if(t.dataset.edit)editD(p0().id,()=>{list=list.map(x=>x.id==p0().id?{...x,desc:S.ed[x.id]}:x);show()});else if(t.dataset.del){delP(p0().id);list.splice(i,1);i=Math.min(i,list.length-1);show()}};
const p0=()=>list[i];show()}
function detect(vw){const m=$('.m video,.m img',vw),sd=$('.side',vw);if(!m||!sd)return;const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d',{willReadFrequently:true});
const chk=()=>{try{x.drawImage(m,0,0,24,24);const d=x.getImageData(0,12,10,12).data;let s=0;for(let i=0;i<d.length;i+=4)s+=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];sd.classList.toggle('dk',s/(d.length/4)>140)}catch(e){sd.classList.add('dk')}};
if(m.tagName=='IMG'){m.complete?chk():m.onload=chk}else{m.onloadeddata=chk;let t=0;m.ontimeupdate=()=>{const n=Date.now();if(n-t>1200){t=n;chk()}}}}
function hearts(el){const r=el.getBoundingClientRect();for(let k=0;k<7;k++){const h=document.createElement('div');h.className='fh';h.innerHTML=I('heart',18+Math.random()*18,1);h.style.cssText=`position:fixed;left:${r.left+r.width/2-10+(Math.random()*40-20)}px;top:${r.top}px;--r:${Math.random()*50-25}deg;animation-delay:${k*60}ms`;document.body.appendChild(h);setTimeout(()=>h.remove(),1400)}}
function toggleLike(id){S.liked[id]=!S.liked[id];S.likes[id]=(S.likes[id]||0)+(S.liked[id]?1:-1);save()}
function toggleFol(id){const a=S.fol[ME]=S.fol[ME]||[],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save()}
function delP(id){if(!confirm('למחוק את הפריט?'))return;const p=posts.find(x=>x.id==id);if(p&&!p.seed)idbDel(id);S.del.push(id);save();toast('נמחק')}
function editD(id,cb){const p=vis().find(x=>x.id==id),b=document.createElement('div');b.className='bg';b.style.zIndex=90;b.innerHTML=`<div class="mod"><h3>עריכת תיאור</h3><textarea class="f" rows="4">${esc(p.desc)}</textarea><button class="btn">שמירה</button></div>`;document.body.appendChild(b);
b.onclick=e=>{if(e.target==b)b.remove()};$('.btn',b).onclick=()=>{S.ed[id]=$('textarea',b).value;save();b.remove();cb?cb():render()}}
/* upload */
function upload(){const b=document.createElement('div');b.className='bg';let file=null,kind='';
b.innerHTML=`<div class="mod"><h3>הוספת תמונה או סרטון <button class="circ" style="width:36px;height:36px" data-c>${I('x',18)}</button></h3>
<div class="drop">${I('up',34)}<p>גררו קובץ לכאן או לחצו לבחירה<br><small>סרטון עד 2:30 דקות, ללא הגבלת משקל</small></p><input type="file" accept="image/*,video/*" hidden></div>
<input class="f" id="u1" placeholder="או כתובת URL של תמונה"><div id="pv"></div>
<textarea class="f" id="u2" rows="3" placeholder="טקסט תיאור"></textarea><input class="f" id="u3" placeholder="טקסט על התמונה (לתמונות בלבד)">
<label style="display:flex;gap:8px;margin:8px 0"><input type="checkbox" id="u4"> תוכן עסקי</label><button class="btn" id="go" style="width:100%">${I('up',18)} פרסום</button></div>`;
document.body.appendChild(b);const dz=$('.drop',b),inp=$('input[type=file]',b);
const pick=f=>{if(!f)return;kind=f.type.startsWith('video')?'video':'image';const u=URL.createObjectURL(f);
if(kind=='video'){const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{if(v.duration>150){toast('הסרטון ארוך מ-2:30 דקות');file=null;$('#pv',b).innerHTML=''}else{file=f;$('#pv',b).innerHTML=`<video class="prev" src="${u}" controls></video>`}};v.src=u}
else{file=f;$('#pv',b).innerHTML=`<img class="prev" src="${u}">`}};
dz.onclick=()=>inp.click();inp.onchange=()=>pick(inp.files[0]);dz.ondragover=e=>{e.preventDefault();dz.classList.add('hv')};dz.ondragleave=()=>dz.classList.remove('hv');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('hv');pick(e.dataTransfer.files[0])};
b.onclick=e=>{if(e.target==b||e.target.closest('[data-c]'))b.remove()};
$('#go',b).onclick=async()=>{const url=$('#u1',b).value.trim(),txt=$('#u3',b).value;if(!file&&!url)return toast('בחרו קובץ או הזינו כתובת');
let blob=file,type=kind||'image';if(type=='image')blob=await wm(file||url,txt);if(!blob)return toast('לא ניתן לטעון את התמונה');
const p={id:'n'+Date.now(),uid:ME,type,desc:$('#u2',b).value,biz:$('#u4',b).checked,ts:Date.now(),blob};idbPut(p);p.src=typeof blob=='string'?blob:URL.createObjectURL(blob);posts.push(p);b.remove();location.hash='home';render();toast('פורסם בהצלחה')}}
function wm(src,txt){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{const s=Math.min(1,1600/im.width),w=im.width*s,h=im.height*s,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
if(txt){x.font=`800 ${w*.07}px "Segoe UI",Arial`;x.textAlign='center';x.fillStyle='#fff';x.strokeStyle='rgba(0,0,0,.7)';x.lineWidth=w*.012;x.strokeText(txt,w/2,h*.88,w*.9);x.fillText(txt,w/2,h*.88,w*.9)}
const lw=Math.max(120,w*.22),lc=document.createElement('canvas');logo(lc,lw,lw*.31);lc.style.width=lc.width+'px';x.globalAlpha=.9;x.drawImage(lc,w/2-lw/2,h*.02,lw,lw*.31);c.toBlob(b=>res(b),'image/jpeg',.9)}catch(e){res(typeof src=='string'?src:null)}};
im.onerror=()=>res(typeof src=='string'?src:null);im.src=typeof src=='string'?src:URL.createObjectURL(src)})}
/* events */
document.addEventListener('click',e=>{const t=e.target;let a;
if(a=t.closest('[data-like]')){if(t.closest('.vw'))return;e.stopPropagation();const w=S.liked[a.dataset.like];toggleLike(a.dataset.like);if(!w)hearts(a);render();return}
if(a=t.closest('[data-share]')){if(t.closest('.vw'))return;e.stopPropagation();copy('post-'+a.dataset.share);return}
if(a=t.closest('[data-edit]')){if(t.closest('.vw'))return;e.stopPropagation();editD(a.dataset.edit);return}
if(a=t.closest('[data-del]')){if(t.closest('.vw'))return;e.stopPropagation();delP(a.dataset.del);render();return}
if(a=t.closest('[data-fl]')){if(t.closest('.vw'))return;toggleFol(a.dataset.fl);render();return}
if(a=t.closest('[data-sh]')){copy(a.dataset.sh);return}
if(a=t.closest('[data-ul]')){const l=ulData[a.dataset.ul];$('#ulb').innerHTML=`<div class="prof ul" style="display:block;margin-top:14px"><b>${a.dataset.ul=='f1'?'עוקבים':'עוקב אחרי'}</b>${l.map(id=>`<a href="#profile-${id}">${av(id,34)}${esc(U(id).name)}</a>`).join('')||'<p class="empty">אין עדיין</p>'}</div>`;return}
if(a=t.closest('[data-open]'))openV(a.dataset.open,window.cur||vis());
if(t.id=='ss'){S.users[ME].name=$('#sn').value||'מנהל האתר';S.users[ME].about=$('#sa').value;save();toast('נשמר');render()}});
document.addEventListener('change',e=>{if(e.target.id=='avf'){const f=e.target.files[0],r=new FileReader();r.onload=()=>{S.users[ME].img=r.result;save();render()};f&&r.readAsDataURL(f)}});
document.addEventListener('mouseover',e=>{const c=e.target.closest('.card[data-v]');if(c){const v=$('video',c);v&&v.play().catch(()=>{})}});
document.addEventListener('mouseout',e=>{const c=e.target.closest('.card[data-v]');if(c&&!c.contains(e.relatedTarget)){const v=$('video',c);v&&v.pause()}});
window.onhashchange=render;
(async()=>{seed();await idb();(await idbAll()).forEach(p=>{p.src=typeof p.blob=='string'?p.blob:URL.createObjectURL(p.blob);posts.push(p)});shell();render()})();
</script>
